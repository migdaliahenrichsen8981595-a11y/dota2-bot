<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Helper</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Навигация -->
        <nav class="nav-bar">
            <button class="nav-btn active" data-page="tierlist">📊 Tier List</button>
            <button class="nav-btn" data-page="counterpicks">🎯 Контрпики</button>
            <button class="nav-btn" data-page="builds">⚔️ Билды</button>
        </nav>

        <!-- Страница Tier List -->
        <div id="tierlist-page" class="page active">
            <div class="page-header">
                <h1>🏆 Tier List Героев</h1>
                <p class="subtitle">Патч 7.37 • Обновлено сегодня</p>
            </div>

            <div class="tier-container">
                <div class="tier s-tier">
                    <div class="tier-label">S</div>
                    <div class="heroes-grid" id="s-tier-heroes"></div>
                </div>

                <div class="tier a-tier">
                    <div class="tier-label">A</div>
                    <div class="heroes-grid" id="a-tier-heroes"></div>
                </div>

                <div class="tier b-tier">
                    <div class="tier-label">B</div>
                    <div class="heroes-grid" id="b-tier-heroes"></div>
                </div>

                <div class="tier c-tier">
                    <div class="tier-label">C</div>
                    <div class="heroes-grid" id="c-tier-heroes"></div>
                </div>
            </div>
        </div>

        <!-- Страница Counter Picks -->
        <div id="counterpicks-page" class="page">
            <div class="page-header">
                <h1>🎯 Контрпики</h1>
                <p class="subtitle">Выбери героев врага для подбора контры</p>
            </div>

            <div class="enemy-selection">
                <h3>Команда противника:</h3>
                <div id="selected-enemies" class="selected-enemies"></div>
                <button class="btn-primary" id="search-heroes">Поиск героев</button>
            </div>

            <div id="hero-search" class="hero-search hidden">
                <input type="text" id="search-input" placeholder="Поиск героя...">
                <div id="search-results" class="search-results"></div>
            </div>

            <div id="counter-suggestions" class="counter-suggestions"></div>
        </div>

        <!-- Страница Билдов -->
        <div id="builds-page" class="page">
            <div class="page-header">
                <h1>⚔️ Билды Героев</h1>
                <p class="subtitle">Актуальные сборки предметов</p>
            </div>

            <div class="hero-selector">
                <input type="text" id="build-search" placeholder="Найти героя...">
                <div id="build-heroes-list" class="heroes-list"></div>
            </div>

            <div id="hero-build-detail" class="hero-build-detail hidden"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
